allowBuilds:
  # Los dos los usa solo jest. Sus scripts compilan o descargan el binario nativo si
  # falta, pero ya llega por optionalDependencies, así que no hace falta ejecutarlos
  '@parcel/watcher': false
  unrs-resolver: false

# Versiones con parche de seguridad que se pueden instalar sin esperar el día de
# minimumReleaseAge (las agregó `pnpm audit --fix=update`)
minimumReleaseAgeExclude:
  - fast-uri@3.1.4 || 3.1.5 || 3.1.6 || 3.1.7 || 3.1.8
  - brace-expansion@5.0.8 || 5.0.9 || 5.0.10 || 5.0.11 || 5.0.12
  - js-yaml@3.15.1 || 3.15.2
  - browserslist@4.28.7
  - baseline-browser-mapping@2.11.0

# Dependencias indirectas (solo de desarrollo) que `pnpm update` no subió a la versión
# con el parche de seguridad. Mismas versiones mayores, sin cambios de API
overrides:
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'browserslist@<4.28.7': ^4.28.7
  'baseline-browser-mapping@<2.11.0': ^2.11.0

auditConfig:
  ignoreGhsas:
    # sprintf-js (DoS con especificadores de precisión): no hay versión corregida
    # publicada (la última es 1.1.3). Solo llega a jest (js-yaml 3 → argparse 1) para
    # leer la configuración de cobertura; no procesa datos de usuarios. Revisar cuando
    # salga sprintf-js 1.1.4
    - GHSA-hp3w-g68c-fv3c
